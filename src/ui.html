<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <style>
        body {
            font-family: sans-serif;
            padding: 12px;
        }

        textarea {
            width: 100%;
            height: 120px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 8px;
            margin-top: 8px;
        }
    </style>
</head>

<body>
    <h3>HTML → Figma Import</h3>
    <p>Paste the JSON copied from the browser extension:</p>
    <textarea id="jsonInput"></textarea>
    <button id="importBtn">Import</button>

    <script>
        document.getElementById("importBtn").addEventListener("click", () => {
            const value = document.getElementById("jsonInput").value;
            parent.postMessage({ pluginMessage: { type: "import", data: value } }, "*");
        });
    </script>
</body>

</html>
